services:
  cloudshelf:
    image: node:22-bookworm-slim
    container_name: cloudshelf
    working_dir: /app
    command: ["node", "--experimental-sqlite", "src/server.js"]
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - ./:/app:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
